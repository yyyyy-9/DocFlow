name: Source and workflow checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/run_tests.py --group core --out .work/core
  browser-and-word:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-browser.txt
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: HRS_Bridge
      - run: python -m playwright install chromium
      - name: Configure browser, Node and native math converter
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .work | Out-Null
          Invoke-WebRequest 'https://github.com/jgm/pandoc/releases/download/3.12.1/pandoc-3.12.1-windows-x86_64.zip' -OutFile .work/pandoc.zip
          if ((Get-FileHash .work/pandoc.zip -Algorithm SHA256).Hash.ToLower() -ne '6ef431cb20b2c24a0371fc19200dc49d452be54b1b5c9239f3462841ef53e587') { throw 'Pandoc digest mismatch' }
          Expand-Archive .work/pandoc.zip .work/pandoc
          $docflowPandoc = Get-ChildItem .work/pandoc -Recurse -Filter pandoc.exe | Select-Object -First 1
          "PANDOC_PATH=$($docflowPandoc.FullName)" >> $env:GITHUB_ENV
          "HRS_BRIDGE_NODE=$((Get-Command node).Source)" >> $env:GITHUB_ENV
          "HRS_BRIDGE_NODE_MODULES=$((Resolve-Path HRS_Bridge/node_modules).Path)" >> $env:GITHUB_ENV
          python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print('CHROMIUM_PATH='+p.chromium.executable_path); p.stop()" >> $env:GITHUB_ENV
      - run: python tools/run_tests.py --group all --out .work/all
